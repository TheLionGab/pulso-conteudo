<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070a;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      @font-face { font-family: 'Inter'; src: url('assets/fonts/Inter_800ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: block; }
      .brand-bug {
        position: absolute;
        top: 1790px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        opacity: 0;
        pointer-events: none;
        font-family: "Inter", system-ui, sans-serif;
        z-index: 5;
      }
      .brand-bug svg { width: 34px; height: 34px; overflow: visible; }
      .brand-bug .pdc-p {
        fill: none;
        stroke: url(#pdcg-bug);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand-bug span {
        font-weight: 800;
        font-size: 21px;
        letter-spacing: -0.02em;
        color: #5b6577;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <!--
      Reel de engenharia — a escada de resolução de preço do motor Pulso.
      Narração (voz Jose-Arnelas/ElevenLabs) sobre o mesmo argumento que
      aparece na tela. Todo número vem de worker/ingest/resolver.py
      (POLO_ANCHORS, DISTANCE_OVERRIDES, RESOLUTION_FLAGS) do repo
      mercado-fisico-mt. Nada é ilustrativo. Ver STORYBOARD.md.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-spread"
        class="scene"
        data-composition-id="01-spread"
        data-composition-src="compositions/frames/01-spread.html"
        data-start="0"
        data-duration="4.0"
        data-track-index="0"
      ></div>

      <div
        id="el-02-vazio"
        class="scene"
        data-composition-id="02-vazio"
        data-composition-src="compositions/frames/02-vazio.html"
        data-start="3.5"
        data-duration="4.1"
        data-track-index="1"
      ></div>

      <div
        id="el-03-escada-alta"
        class="scene"
        data-composition-id="03-escada-alta"
        data-composition-src="compositions/frames/03-escada-alta.html"
        data-start="7.1"
        data-duration="5.0"
        data-track-index="0"
      ></div>

      <div
        id="el-04-paridade"
        class="scene"
        data-composition-id="04-paridade"
        data-composition-src="compositions/frames/04-paridade.html"
        data-start="12.1"
        data-duration="5.0"
        data-track-index="1"
      ></div>

      <div
        id="el-05-vacuo"
        class="scene"
        data-composition-id="05-vacuo"
        data-composition-src="compositions/frames/05-vacuo.html"
        data-start="16.6"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="21.0"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div id="el-brand-bug" class="clip brand-bug" data-start="4.0" data-duration="12.5" data-track-index="5">
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <defs>
            <linearGradient id="pdcg-bug" x1="220" y1="310" x2="804" y2="830" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6EE7B7"></stop>
              <stop offset="0.48" stop-color="#10B981"></stop>
              <stop offset="1" stop-color="#047857"></stop>
            </linearGradient>
          </defs>
          <path class="pdc-p" d="M220 462H350L405 405L467 536L548 310L618 462H804" stroke-width="58"></path>
          <path class="pdc-p" d="M512 584V832" stroke-width="58"></path>
          <path class="pdc-p" d="M452 584C438 680 406 760 360 830" stroke-width="48" opacity="0.88"></path>
          <path class="pdc-p" d="M572 584C586 680 618 760 664 830" stroke-width="48" opacity="0.88"></path>
          <path class="pdc-p" d="M398 594C352 678 306 754 246 814" stroke-width="38" opacity="0.48"></path>
          <path class="pdc-p" d="M626 594C672 678 718 754 778 814" stroke-width="38" opacity="0.48"></path>
        </svg>
        <span>Pulso do Campo</span>
      </div>

      <audio id="el-bgm" src=".media/audio/bgm/bgm_001.mp3" data-start="0" data-duration="25.5" data-track-index="19" data-volume="0.35"></audio>

      <audio id="el-vo" src="assets/vo/reel1-jose-arnelas-rascunho.mp3" data-start="0" data-duration="24.15" data-track-index="18" data-volume="1.0" data-has-audio="true"></audio>

      <!-- frame 01 — the two praças land, then the gap hits -->
      <audio id="el-sfx-00" src="assets/sfx/pop.mp3" data-start="0.6" data-duration="0.72" data-track-index="20" data-volume="0.32"></audio>
      <audio id="el-sfx-01" src="assets/sfx/pop.mp3" data-start="1.1" data-duration="0.72" data-track-index="21" data-volume="0.32"></audio>
      <audio id="el-sfx-02" src="assets/sfx/impact-bass-1.mp3" data-start="1.94" data-duration="2.0" data-track-index="22" data-volume="0.4"></audio>

      <!-- frame 02 — the grid sweeps in -->
      <audio id="el-sfx-03" src="assets/sfx/whoosh-short.mp3" data-start="3.5" data-duration="0.57" data-track-index="23" data-volume="0.32"></audio>
      <audio id="el-sfx-04" src="assets/sfx/typing.mp3" data-start="4.08" data-duration="1.2" data-track-index="24" data-volume="0.26"></audio>
      <audio id="el-sfx-05" src="assets/sfx/impact-bass-2.mp3" data-start="6.12" data-duration="1.5" data-track-index="25" data-volume="0.32"></audio>

      <!-- frame 03 — one beat per rung -->
      <audio id="el-sfx-06" src="assets/sfx/whoosh-short.mp3" data-start="7.1" data-duration="0.57" data-track-index="26" data-volume="0.3"></audio>
      <audio id="el-sfx-07" src="assets/sfx/click-soft.mp3" data-start="8.12" data-duration="0.37" data-track-index="27" data-volume="0.4"></audio>
      <audio id="el-sfx-08" src="assets/sfx/click-soft.mp3" data-start="9.38" data-duration="0.37" data-track-index="28" data-volume="0.4"></audio>

      <!-- frame 04 — the subtraction, line by line, then the result -->
      <audio id="el-sfx-09" src="assets/sfx/click-soft.mp3" data-start="13.26" data-duration="0.37" data-track-index="29" data-volume="0.36"></audio>
      <audio id="el-sfx-10" src="assets/sfx/click-soft.mp3" data-start="13.7" data-duration="0.37" data-track-index="30" data-volume="0.36"></audio>
      <audio id="el-sfx-11" src="assets/sfx/click-soft.mp3" data-start="14.12" data-duration="0.37" data-track-index="31" data-volume="0.36"></audio>
      <audio id="el-sfx-12" src="assets/sfx/impact-bass-2.mp3" data-start="14.66" data-duration="1.5" data-track-index="32" data-volume="0.34"></audio>

      <!-- frame 05 — the empty card gets air, then the thesis -->
      <audio id="el-sfx-13" src="assets/sfx/whoosh-short.mp3" data-start="16.6" data-duration="0.57" data-track-index="33" data-volume="0.3"></audio>
      <audio id="el-sfx-14" src="assets/sfx/impact-bass-1.mp3" data-start="18.46" data-duration="2.0" data-track-index="34" data-volume="0.36"></audio>

      <!-- frame 06 — recap ticks, then the lockup -->
      <audio id="el-sfx-15" src="assets/sfx/riser.mp3" data-start="21.0" data-duration="2.4" data-track-index="35" data-volume="0.3"></audio>
      <audio id="el-sfx-16" src="assets/sfx/impact-bass-1.mp3" data-start="22.3" data-duration="2.12" data-track-index="36" data-volume="0.36"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // 01→02 crossfade
        tl.to("#el-01-spread", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-vazio", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);

        // 02→03 push-slide LEFT — the argument moves forward, it doesn't dissolve
        tl.to("#el-02-vazio", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 7.1);
        tl.fromTo("#el-03-escada-alta", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 7.1);

        // 03→04 hard cut — same ladder, next pair of rungs, no transition needed

        // 04→05 crossfade
        tl.to("#el-04-paridade", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16.6);
        tl.fromTo("#el-05-vacuo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16.6);

        // brand bug rides the middle of the piece, leaves before the lockup
        tl.fromTo("#el-brand-bug", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.2);
        tl.to("#el-brand-bug", { opacity: 0, duration: 0.3, ease: "power2.in" }, 16.2);

        // 05→06 zoom-through
        tl.to("#el-05-vacuo", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 21.0);
        tl.fromTo("#el-06-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 21.0);

        tl.to({}, { duration: 25.5 }, 0); // full-span anchor
      })();
    </script>
  </body>
</html>
