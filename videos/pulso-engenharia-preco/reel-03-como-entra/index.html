      .brand-bug {
        position: absolute;
        top: 1790px; left: 0; right: 0;
        display: flex; justify-content: center; align-items: center;
        gap: 12px;
        opacity: 0;
        pointer-events: none;
        font-family: "Inter", system-ui, sans-serif;
        z-index: 5;
      }
      .brand-bug svg { width: 34px; height: 34px; overflow: visible; }
      .brand-bug .pdc-p {
        fill: none;
        stroke: url(#pdcg-bug3);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand-bug span {
        font-weight: 800; font-size: 21px;
        letter-spacing: -0.02em; color: #5b6577;
        line-height: 1;
      }

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // 01→02 crossfade — da decisão editorial para a base que a substitui
        tl.to("#el-01", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.9);
        tl.fromTo("#el-02", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.9);

        // 02→03 push-slide LEFT — da base para a rotina diária
        tl.to("#el-02", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 8.2);
        tl.fromTo("#el-03", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 8.2);

        // 03→04 hard cut

        // brand bug no miolo
        tl.fromTo("#el-brand-bug", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.6);
        tl.to("#el-brand-bug", { opacity: 0, duration: 0.3, ease: "power2.in" }, 12.3);

        // 04→05 zoom-through
        tl.to("#el-04", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 18.2);
        tl.fromTo("#el-05", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 18.2);

        tl.to({}, { duration: 22.4 }, 0);
      })();
