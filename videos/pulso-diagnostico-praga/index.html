<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pulso do Campo — Diagnóstico por foto</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070a;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070a;
      }
      /* sub-comp slots stretch to fill the root (root-level clip auto-layout
         already does this; declared explicitly for clarity/robustness) */
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Pulso do Campo — Diagnóstico de praga/doença por foto (20s, 1080x1920).
      4 beats, cada um uma sub-composição: 01-camera (0-4s), 02-analisando
      (4-9s), 03-resultado (9-16s), 04-cta (16-20s). Locução (4 clipes) e SFX
      montados no root, tempo global. Ver BRIEF.md.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="20"
    >
      <!-- ================= VISUAL SCENES (track 1) ================= -->
      <div
        id="el-01-camera"
        data-composition-id="01-camera"
        data-composition-src="compositions/frames/01-camera.html"
        data-start="0"
        data-duration="4.0"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-02-analisando"
        data-composition-id="02-analisando"
        data-composition-src="compositions/frames/02-analisando.html"
        data-start="4.0"
        data-duration="5.0"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-03-resultado"
        data-composition-id="03-resultado"
        data-composition-src="compositions/frames/03-resultado.html"
        data-start="9.0"
        data-duration="7.0"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-04-cta"
        data-composition-id="04-cta"
        data-composition-src="compositions/frames/04-cta.html"
        data-start="16.0"
        data-duration="4.0"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- ================= LOCUÇÃO — 4 clipes (track 10) =================
           vo-01..04.mp3: gravados nesta sessão (guard de segredo liberado
           pelo dono em paralelo). data-duration usa a duração real medida
           via ffprobe, não a estimativa do brief. -->
      <audio
        id="vo-01"
        src="assets/vo/vo-01.mp3"
        data-start="0"
        data-duration="1.59"
        data-track-index="10"
        data-volume="1.0"
      ></audio>

      <audio
        id="vo-02"
        src="assets/vo/vo-02.mp3"
        data-start="4.0"
        data-duration="3.21"
        data-track-index="10"
        data-volume="1.0"
      ></audio>

      <audio
        id="vo-03"
        src="assets/vo/vo-03.mp3"
        data-start="9.0"
        data-duration="4.62"
        data-track-index="10"
        data-volume="1.0"
      ></audio>

      <audio
        id="vo-04"
        src="assets/vo/vo-04.mp3"
        data-start="16.0"
        data-duration="3.06"
        data-track-index="10"
        data-volume="1.0"
      ></audio>

      <audio id="bgm" src="assets/bgm/bed-pulso-heygen-v22.mp3" data-start="0" data-duration="20" data-track-index="19" data-volume="0.12"></audio>

      <!-- ================= SFX — beats pontuais (track 11) =================
           Volumes moderados (0.28-0.4) para não abafar a locução. -->
      <audio
        id="sfx-whoosh-camera"
        src="assets/sfx/whoosh-short.mp3"
        data-start="0"
        data-track-index="11"
        data-volume="0.35"
      ></audio>

      <audio
        id="sfx-typing-scan-1"
        src="assets/sfx/typing.mp3"
        data-start="4.3"
        data-duration="1.3"
        data-track-index="11"
        data-volume="0.28"
      ></audio>
      <audio
        id="sfx-typing-scan-2"
        src="assets/sfx/typing.mp3"
        data-start="5.7"
        data-duration="1.3"
        data-track-index="11"
        data-volume="0.28"
      ></audio>
      <audio
        id="sfx-typing-scan-3"
        src="assets/sfx/typing.mp3"
        data-start="7.1"
        data-duration="1.3"
        data-track-index="11"
        data-volume="0.28"
      ></audio>

      <audio
        id="sfx-pop-card"
        src="assets/sfx/pop.mp3"
        data-start="9.15"
        data-track-index="11"
        data-volume="0.4"
      ></audio>

      <audio
        id="sfx-click-cta"
        src="assets/sfx/click-soft.mp3"
        data-start="17.9"
        data-track-index="11"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      // Root timeline stays near-empty: all choreography lives in the four
      // sub-compositions above, each keyed by its own data-composition-id.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
