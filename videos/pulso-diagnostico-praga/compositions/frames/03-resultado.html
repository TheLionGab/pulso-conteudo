      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          window.__timelines["03-resultado"] = tl;

          /* ---------- card lands with a confident pop ---------- */
          tl.fromTo("#f03-device", { scale: 0.97, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 0.0);
          tl.fromTo("#f03-card", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

          /* ---------- confidence count-up (deterministic, no repeat) ---------- */
          var confState = { value: 0 };
          var confEl = null;
          tl.to(
            confState,
            {
              value: 92,
              duration: 0.9,
              ease: "power2.out",
              onUpdate: function () {
                if (!confEl) confEl = document.getElementById("f03-conf-value");
                confEl.textContent = Math.round(confState.value) + "%";
              },
            },
            0.5
          );
          tl.fromTo("#f03-conf-bar-fill", { width: "0%" }, { width: "92%", duration: 0.9, ease: "power2.out" }, 0.5);

          /* ---------- recommendation block settles after the read beat ---------- */
          tl.fromTo("#f03-rec-block", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.6);
          tl.fromTo("#f03-disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.0);

          // hold the full result readable until the cut at 7.0s
        })();
      </script>
