<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070a;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* persistent brand bug — top centre, between each frame's kicker
         (left) and catalogue numeral (right); above Frame 2's header
         (y 132) and Frame 5's chrome bar (y 128). Never inside a device. */
      @font-face { font-family: 'Inter'; src: url('assets/fonts/Inter_800ExtraBold.ttf') format('truetype'); font-weight: 800; font-style: normal; font-display: block; }
      .brand-bug {
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        opacity: 0;
        pointer-events: none;
        font-family: "Inter", system-ui, sans-serif;
        z-index: 5;
      }
      .brand-bug svg {
        width: 40px;
        height: 40px;
        overflow: visible;
      }
      .brand-bug .pdc-p {
        fill: none;
        stroke: url(#pdcg-bug);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand-bug span {
        font-weight: 800;
        font-size: 24px;
        letter-spacing: -0.02em;
        color: #ffffff;
        line-height: 1;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions ──
      (function () { var tl = window.__timelines["main"];
        // 01→02 crossfade
        tl.to("#el-01-abertura", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-busca", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        // 02→03 push-slide LEFT
        tl.to("#el-02-busca", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 8.5);
        tl.fromTo("#el-03-comprador", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 8.5);
        // 03→04 hard cut — no tween
        // 04→06 crossfade (mapa removido na V2)
        tl.to("#el-04-carrossel", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-06-contraste", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.5);
        // brand bug — frames 2..6
        tl.fromTo("#el-brand-bug", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.1);
        tl.to("#el-brand-bug", { opacity: 0, duration: 0.3, ease: "power2.in" }, 19.7);
        // 06→07 zoom-through
        tl.to("#el-06-contraste", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 20.5);
        tl.fromTo("#el-07-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 20.5);
        tl.to({}, { duration: 22 }, 0);
      })();
    </script>
