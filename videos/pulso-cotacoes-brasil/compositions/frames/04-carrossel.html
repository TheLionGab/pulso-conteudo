<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    window.__timelines["04-carrossel"] = tl;

    /* -----------------------------------------------------------------
       Frame 04 — "Carrossel: cidade após cidade"
       4.0s total. No narration, no new copy — the repeated swipe gesture
       across 4 real price cards is the whole argument (national coverage
       proven by rhythm, not by a claim).

       Timing model — 4 identical ~0.775s cycles back to back (0.3–3.4s):
         settle (0.465s, card fully readable) -> drag (0.31s, card exits
         left + next card slides in from the right, arriving exactly as
         the old one leaves). The cursor "grips" the card for the first
         60% of the drag (moving WITH it, synced), then releases and
         glides back to the ready position while the card finishes
         flying off-screen alone with momentum — a real swipe-and-release,
         not a floating cursor. Card 4 has no exit: it settles and holds
         until the whole group fades on a clean dark hold for the cut
         into the next frame (Brazil map).
       ----------------------------------------------------------------- */

    var CYCLE = 0.775; // total per city
    var SETTLE = 0.465; // readable hold before the next drag starts
    var DRAG = CYCLE - SETTLE; // 0.31s — full exit/enter travel time
    var GRIP = DRAG * 0.6; // 0.186s — cursor moves WITH the card, then releases
    var CARD_TRAVEL = 1200; // px — clears the 1080-wide canvas either direction
    var CURSOR_GRIP_DIST = 190; // px — the cursor's own short "finger" travel

    var c1Start = 0.3;
    var c2Start = c1Start + CYCLE; // 1.075
    var c3Start = c2Start + CYCLE; // 1.85
    var c4Start = c3Start + CYCLE; // 2.625
    var groupFadeStart = c4Start + CYCLE; // 3.4

    var cursor = "#f04-cursor";

    /* Cards 2–4 have no tween touching them until their own entrance
       fires (0.765s / 1.54s / 2.315s respectively) — a GSAP tween never
       renders its "from" state before the timeline's playhead actually
       enters its [start, start+duration] window, so without this they
       would sit at their untouched default (x:0), stacked directly on
       top of card 1 and each other from t=0. Set the off-screen resting
       position explicitly up front so every card is correctly hidden
       until its own entrance animates it in. */
    gsap.set(["#f04-card-2", "#f04-card-3", "#f04-card-4"], { x: CARD_TRAVEL });

    /* one out/in swap: outgoing card exits left (translate + slight
       rotation, fading only in its last 40%), incoming card slides in
       from the right on the same clock; the cursor grips + releases. */
    function swap(outSel, inSel, dragStart, rotDeg) {
      var fadeStart = dragStart + GRIP; // last 40% of the drag = the fade window
      var fadeDur = DRAG - GRIP;

      // outgoing card: translate + rotate across the full drag window
      tl.fromTo(
        outSel,
        { x: 0, rotation: 0 },
        { x: -CARD_TRAVEL, rotation: rotDeg, duration: DRAG, ease: "power3.out" },
        dragStart
      );
      // outgoing card: opacity fade only over the last 40% of that travel
      tl.fromTo(outSel, { opacity: 1 }, { opacity: 0, duration: fadeDur, ease: "power2.out" }, fadeStart);

      // incoming card: slides in from the right, arriving exactly as the old one leaves
      tl.fromTo(inSel, { x: CARD_TRAVEL }, { x: 0, duration: DRAG, ease: "power3.out" }, dragStart);

      // cursor: grips the card (moves WITH it) for the first 60% of the drag...
      tl.fromTo(cursor, { x: 0 }, { x: -CURSOR_GRIP_DIST, duration: GRIP, ease: "power2.out" }, dragStart);
      // ...a quick compress/expand sells the grab, pivoting on the tip...
      tl.fromTo(cursor, { scale: 1 }, { scale: 0.88, duration: 0.06, ease: "power2.in" }, dragStart);
      tl.fromTo(cursor, { scale: 0.88 }, { scale: 1, duration: 0.12, ease: "power2.out" }, dragStart + 0.06);
      // ...then releases and glides back to the ready position for the next grab.
      tl.fromTo(cursor, { x: -CURSOR_GRIP_DIST }, { x: 0, duration: 0.35, ease: "power3.out" }, fadeStart);
    }

    /* ---------- Scene 1 (0.0–0.3s): chrome in, card 1 + cursor already in place ---------- */
    tl.fromTo(
      ["#f04-chrome-kicker", "#f04-chrome-num"],
      { opacity: 0, y: -10 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
      0.05
    );
    tl.fromTo(
      "#f04-chrome-bar",
      { scaleX: 0, transformOrigin: "0% 50%" },
      { scaleX: 1, duration: 0.45, ease: "power2.out" },
      0.05
    );
    // Otherwise nothing to animate here by design — card 1 and the cursor sit
    // at rest (their CSS/first-tween "from" state) until the first drag fires at 0.765s.

    /* ---------- Scene 2 (0.3–3.4s): 4 back-to-back swipe cycles ---------- */
    swap("#f04-card-1", "#f04-card-2", c1Start + SETTLE, -3); // 0.765–1.075
    swap("#f04-card-2", "#f04-card-3", c2Start + SETTLE, -2.5); // 1.54–1.85
    swap("#f04-card-3", "#f04-card-4", c3Start + SETTLE, -3.5); // 2.315–2.625
    // card 4 has no exit — it just arrives and holds through the fade.

    /* ---------- Scene 3 (3.4–4.0s): clean fade to bare dark ground ---------- */
    tl.fromTo(
      "#f04-swipe-group",
      { opacity: 1 },
      { opacity: 0, duration: 0.3, ease: "power2.out" },
      groupFadeStart
    );
    // 3.7–4.0s: bare #05070a ground holds — clean cut point into the next frame.
  })();
</script>
