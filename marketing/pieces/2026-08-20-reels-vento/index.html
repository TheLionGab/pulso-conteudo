<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Reels — o fator que fecha a janela</title>
    <!--
      Reels 1080x1920, 18s. Pilar "Como se calcula" (docs/PLANO-FUNIL.md).

      Mesma fonte de números do carrossel 2026-08-20-janela-pulverizacao:
      executar apps/meu-talhao/lib/operationWindow.ts. Nada estimado.

      Determinismo: nenhuma animação roda sozinha. Cada cena é uma camada com
      `animation-play-state: paused` e delay negativo, então o quadro é função
      pura de `?t=<ms>` — 540 quadros reproduzíveis, e o mesmo MP4 em duas
      execuções.

      Safe area do Reels é DIFERENTE da do Stories: a legenda e os botões comem
      ~480px embaixo e a coluna de ações ~200px à direita. Conteúdo fora dessa
      caixa fica atrás da UI do app.
    -->
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1920px;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        isolation: isolate;
      }

      .safe {
        position: absolute;
        top: 220px;
        right: 210px;
        bottom: 480px;
        left: 90px;
      }

      /* ---------- marca fixa ---------- */

      .brand {
        position: absolute;
        top: 220px;
        left: 90px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand svg {
        width: 62px;
        height: 62px;
        display: block;
      }

      .brand-name {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--text);
      }

      /* ---------- cenas ---------- */

      .scene {
        position: absolute;
        inset: 120px 0 0 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        animation: scene var(--dur) linear both;
        animation-play-state: paused;
        animation-delay: calc(var(--start) - var(--t));
      }

      /* 0→8% entra, 88→100% sai. O platô no meio é o tempo de leitura: cena de
         Reels que só transita nunca é lida. */
      @keyframes scene {
        0% {
          opacity: 0;
          transform: translateY(34px);
        }
        8% {
          opacity: 1;
          transform: translateY(0);
        }
        88% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-22px);
        }
      }

      .kicker {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-300);
        margin-bottom: 28px;
      }

      .big {
        font-size: 104px;
        font-weight: 900;
        line-height: 1.02;
        letter-spacing: -0.04em;
        color: var(--text);
      }

      .big .em {
        background: linear-gradient(100deg, #a7f3d0 0%, var(--brand-300) 38%, var(--brand-500) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .big .warn {
        color: var(--warn);
      }

      .med {
        font-size: 44px;
        font-weight: 500;
        line-height: 1.34;
        color: var(--text-secondary);
        margin-top: 32px;
      }

      .med strong {
        color: var(--text);
        font-weight: 700;
      }

      /* ---------- pesos ---------- */

      .weights {
        margin-top: 56px;
        display: flex;
        flex-direction: column;
        gap: 34px;
      }

      .weight {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .weight-name {
        width: 260px;
        font-size: 40px;
        font-weight: 700;
        color: var(--text);
      }

      .weight-track {
        flex: 1;
        height: 30px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .weight-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--brand-600), var(--brand-400));
        transform-origin: left center;
        transform: scaleX(var(--pct));
      }

      .weight.dim .weight-fill {
        background: linear-gradient(90deg, #334155, #475569);
      }

      .weight-pct {
        width: 130px;
        text-align: right;
        font-size: 42px;
        font-weight: 800;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- medidor ---------- */

      .gauge {
        margin-top: 56px;
      }

      .gauge-row {
        display: flex;
        align-items: baseline;
        gap: 26px;
      }

      .gauge-number {
        font-size: 210px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.06em;
        font-variant-numeric: tabular-nums;
      }

      .gauge-status {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 14px 30px;
        border-radius: 9999px;
      }

      .gauge-track {
        margin-top: 30px;
        height: 26px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .gauge-fill {
        height: 100%;
        border-radius: 999px;
        transform-origin: left center;
        transform: scaleX(var(--pct));
      }

      .gauge-cond {
        margin-top: 26px;
        font-size: 32px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .is-warn .gauge-number {
        color: var(--warn);
      }
      .is-warn .gauge-status {
        color: var(--warn);
        background: var(--warn-soft);
        border: 1px solid var(--warn-border);
      }
      .is-warn .gauge-fill {
        background: linear-gradient(90deg, #b45309, var(--warn));
      }

      .is-open .gauge-number {
        color: var(--brand-300);
      }
      .is-open .gauge-status {
        color: var(--brand-300);
        background: var(--success-soft);
        border: 1px solid var(--success-border);
      }
      .is-open .gauge-fill {
        background: linear-gradient(90deg, var(--brand-600), var(--brand-400));
      }

      .note {
        margin-top: 44px;
        font-size: 30px;
        line-height: 1.4;
        color: var(--text-muted);
        max-width: 700px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bg"></div>
      <div class="glow"></div>
      <div class="grain"></div>

      <div class="brand">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="none">
          <defs>
            <linearGradient id="mark" x1="220" y1="310" x2="804" y2="830" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6EE7B7" />
              <stop offset="0.48" stop-color="#10B981" />
              <stop offset="1" stop-color="#047857" />
            </linearGradient>
          </defs>
          <path
            d="M220 462H350L405 405L467 536L548 310L618 462H804"
            stroke="url(#mark)"
            stroke-width="58"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M512 584V832" stroke="url(#mark)" stroke-width="58" stroke-linecap="round" />
          <path
            d="M452 584C438 680 406 760 360 830"
            stroke="url(#mark)"
            stroke-width="48"
            stroke-linecap="round"
            opacity="0.88"
          />
          <path
            d="M572 584C586 680 618 760 664 830"
            stroke="url(#mark)"
            stroke-width="48"
            stroke-linecap="round"
            opacity="0.88"
          />
          <path
            d="M398 594C352 678 306 754 246 814"
            stroke="url(#mark)"
            stroke-width="38"
            stroke-linecap="round"
            opacity="0.48"
          />
          <path
            d="M626 594C672 678 718 754 778 814"
            stroke="url(#mark)"
            stroke-width="38"
            stroke-linecap="round"
            opacity="0.48"
          />
        </svg>
        <span class="brand-name">Pulso do Campo</span>
      </div>

      <div class="safe" id="safe"></div>
    </div>

    <script>
      // Cada cena: [início ms, duração ms, html]. As durações somam VIDEO_MS do
      // render.mjs — cena que passa do fim simplesmente não aparece no MP4.
      const SCENES = [
        [
          0,
          4200,
          `<div class="kicker">Antes de ligar a bomba</div>
           <div class="big">Vento de <span class="warn">10&nbsp;km/h</span><br />e <span class="em">30&nbsp;°C</span><br />estão os dois no limite.</div>
           <div class="med">Só <strong>um deles</strong> tira sua janela de pulverização do verde.</div>`,
        ],
        [
          4200,
          4000,
          `<div class="kicker">O peso de cada fator</div>
           <div class="big">Eles não valem<br /><span class="em">a mesma coisa.</span></div>
           <div class="weights">
             <div class="weight"><div class="weight-name">Vento</div>
               <div class="weight-track"><div class="weight-fill" style="--pct:1"></div></div>
               <div class="weight-pct">45%</div></div>
             <div class="weight"><div class="weight-name">Umidade</div>
               <div class="weight-track"><div class="weight-fill" style="--pct:0.667"></div></div>
               <div class="weight-pct">30%</div></div>
             <div class="weight dim"><div class="weight-name">Temperatura</div>
               <div class="weight-track"><div class="weight-fill" style="--pct:0.556"></div></div>
               <div class="weight-pct">25%</div></div>
           </div>`,
        ],
        [
          8200,
          4000,
          `<div class="kicker">Vento no limiar · peso 45%</div>
           <div class="big">A nota cai para</div>
           <div class="gauge is-warn">
             <div class="gauge-row"><span class="gauge-number">55</span><span class="gauge-status">Atenção</span></div>
             <div class="gauge-track"><div class="gauge-fill" style="--pct:0.55"></div></div>
             <div class="gauge-cond">temp 20&nbsp;°C · umidade 80% · vento 10&nbsp;km/h</div>
           </div>`,
        ],
        [
          12200,
          4000,
          `<div class="kicker">Temperatura no limiar · peso 25%</div>
           <div class="big">A janela <span class="em">segue aberta</span></div>
           <div class="gauge is-open">
             <div class="gauge-row"><span class="gauge-number">75</span><span class="gauge-status">Aberta</span></div>
             <div class="gauge-track"><div class="gauge-fill" style="--pct:0.75"></div></div>
             <div class="gauge-cond">temp 30&nbsp;°C · umidade 80% · vento 0&nbsp;km/h</div>
           </div>`,
        ],
        [
          16200,
          2000,
          `<div class="kicker">Pulso do Campo</div>
           <div class="big">Olhe o <span class="em">vento</span><br />primeiro.</div>
           <div class="note">Limiares calibrados para Mato Grosso. Recomendação agronômica é do seu técnico.</div>`,
        ],
      ];

      document.getElementById('safe').innerHTML = SCENES.map(
        ([start, dur, html]) => `<div class="scene" style="--start:${start}ms; --dur:${dur}ms">${html}</div>`,
      ).join('');

      const params = new URLSearchParams(location.search);
      document.documentElement.style.setProperty('--t', `${params.get('t') ?? 0}ms`);

      document.fonts.ready.then(() => {
        document.documentElement.dataset.ready = '1';
      });
    </script>
  </body>
</html>
