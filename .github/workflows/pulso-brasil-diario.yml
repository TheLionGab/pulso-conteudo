name: Pulso Brasil diário

# Vídeo diário do Pulso Brasil inteiro na nuvem, sem o Mac, com os mesmos gates do molde
# (videos/pulso-brasil: G1 dossiê, G2 fala, G3 ASR, G4 manifesto, G5 publicar.mjs em dry-run).
# Fluxo: dados por script (PTAX e IMEA, diario/coletar_dados.py) -> o Claude escreve episodio.json e
# dossie.json (diario/pauta.md, ferramentas restritas) -> trava as fontes -> render -> artifact.
# Publicar no app só com publicar=true E gates verdes, pelo publicar.mjs da origin/main do app.
#
# Gatilhos:
#   workflow_dispatch  dia (AAAA-MM-DD, padrão hoje em Cuiabá), publicar (padrão false), exemplo
#                      (padrão false; usa videos/pulso-brasil/exemplos/2026-11-24-dolar-soja, nunca publica).
#   pull_request       modo prova, só com este arquivo ou diario/ mudado, só PR do próprio repo (fork não
#                      recebe segredo): dia 2026-11-24, publicar=false, dois jobs, "exemplo" (episódio
#                      pronto, sem Claude) e "real" (IMEA por script + Claude até o episodio.py aprovar).
#   schedule           DESLIGADO por enquanto (bloco comentado abaixo). Quem liga é a sessão dona, depois
#                      da prova. Mesmo ligado, o agendado só publica com a variável do repositório
#                      PULSO_PUBLICAR_AGENDADO=true; sem ela gera, confere e guarda o artifact.
#
# Segredos (só nomes): ANTHROPIC_API_KEY (só no passo do Claude), ELEVENLABS_API_KEY (só no render),
# SUPABASE_SERVICE_ROLE_KEY (coleta, acervo, e publicação), APP_REPO_TOKEN (só leitura de Contents
# do privado TheLionGab/Pulso-Do-Campo). Nenhum é impresso; cada passo recebe só o que usa.
# Permissões: contents: read em tudo; contents: write só no job que anexa a linha ao historico.jsonl.

on:
  workflow_dispatch:
    inputs:
      dia:
        description: 'Dia do episódio (AAAA-MM-DD); vazio = hoje em Cuiabá'
        required: false
        type: string
      publicar:
        description: 'Publicar no app (rascunho + aprovar) se todos os gates passarem'
        required: false
        type: boolean
        default: false
      exemplo:
        description: 'Usar o episódio-exemplo de 2026-11-24 (sem Claude, nunca publica)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/pulso-brasil-diario.yml'
      - 'videos/pulso-brasil/diario/**'
      - 'videos/pulso-brasil/assets/baixar_acervo.py'
  # schedule:   # DESLIGADO: a sessão dona liga depois da prova (remova o "# " das duas linhas).
  #   - cron: '30 17 * * 1-5'   # 17:30 UTC = 13:30 em Cuiabá, segunda a sexta

permissions:
  contents: read

concurrency:
  # Um por dia: o mesmo dia não roda duas vezes ao mesmo tempo. PR cancela a rodada anterior do próprio PR.
  group: pulso-brasil-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, inputs.dia || 'hoje') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_URL: https://jgsmgvplwhisapvuqcji.supabase.co

jobs:
  gerar:
    name: gerar (${{ matrix.modo }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        modo: ${{ fromJSON(github.event_name == 'pull_request' && '["exemplo","real"]' || '["auto"]') }}
    outputs:
      dia: ${{ steps.contexto.outputs.dia }}
      modo: ${{ steps.contexto.outputs.modo }}
      publicar: ${{ steps.contexto.outputs.publicar }}
      artefato: ${{ steps.contexto.outputs.artefato }}
      pronto: ${{ steps.pronto.outputs.pronto }}
    env:
      # O contexto runner não existe em env de job: as pastas em runner.temp entram pelo passo Contexto.
      PULSO_APP_REPO: ${{ github.workspace }}/app
      PULSO_HISTORICO: ${{ github.workspace }}/videos/pulso-brasil/historico.jsonl
      RAIZ: ${{ github.workspace }}/videos/pulso-brasil
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Contexto (dia, modo, publicar)
        id: contexto
        env:
          EVENTO: ${{ github.event_name }}
          MATRIZ: ${{ matrix.modo }}
          IN_DIA: ${{ inputs.dia }}
          IN_PUBLICAR: ${{ inputs.publicar }}
          IN_EXEMPLO: ${{ inputs.exemplo }}
          VAR_PUBLICAR_AGENDADO: ${{ vars.PULSO_PUBLICAR_AGENDADO }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          hoje="$(TZ=America/Cuiaba date +%F)"
          case "$EVENTO" in
            pull_request) dia=2026-11-24; modo="$MATRIZ"; publicar=false ;;
            workflow_dispatch)
              dia="${IN_DIA:-$hoje}"; modo=real; publicar="${IN_PUBLICAR:-false}"
              if [ "${IN_EXEMPLO:-false}" = true ]; then modo=exemplo; fi ;;
            *) dia="$hoje"; modo=real; publicar="${VAR_PUBLICAR_AGENDADO:-false}" ;;
          esac
          [[ "$dia" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [ "$(date -d "$dia" +%F)" = "$dia" ] ||
            { echo "dia inválido: use AAAA-MM-DD" >&2; exit 2; }
          if [ "$modo" = exemplo ] && [ "$dia" != 2026-11-24 ]; then echo "O exemplo é de 2026-11-24" >&2; exit 2; fi
          # Exemplo e PR nunca publicam; publicar só da main (o histórico também entra na main).
          if [ "$modo" != real ] || [ "$REF" != refs/heads/main ]; then publicar=false; fi
          if [ "$publicar" != true ]; then publicar=false; fi
          pasta="$RUNNER_TEMP/dia/$dia-instagram"
          mkdir -p "$pasta" "$RUNNER_TEMP/logs"
          {
            echo "DIA=$dia"; echo "MODO=$modo"; echo "PASTA=$pasta"; echo "LOGS=$RUNNER_TEMP/logs"
            echo "PULSO_MODELOS=$RUNNER_TEMP/pulso-modelos"; echo "PULSO_ACERVO=$RUNNER_TEMP/pulso-acervo"
            echo "PULSO_CACHE_VOZ=$RUNNER_TEMP/pulso-voz"
          } >> "$GITHUB_ENV"
          {
            echo "dia=$dia"; echo "modo=$modo"; echo "publicar=$publicar"; echo "artefato=pulso-brasil-$modo-$dia"
          } >> "$GITHUB_OUTPUT"
          echo "dia=$dia modo=$modo publicar=$publicar"

      - name: Exigir segredos (só os nomes)
        env:
          S_ELEVEN: ${{ secrets.ELEVENLABS_API_KEY }}
          S_SUPABASE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S_APP: ${{ secrets.APP_REPO_TOKEN }}
          S_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          faltam=""
          [ -n "$S_ELEVEN" ] || faltam="$faltam ELEVENLABS_API_KEY"
          [ -n "$S_SUPABASE" ] || faltam="$faltam SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$S_APP" ] || faltam="$faltam APP_REPO_TOKEN"
          if [ "$MODO" = real ] && [ -z "$S_ANTHROPIC" ]; then faltam="$faltam ANTHROPIC_API_KEY"; fi
          [ -z "$faltam" ] || { echo "FALTA_SEGREDO:$faltam" >&2; exit 2; }

      - name: App Pulso (só leitura, origin/main para o G5 e a publicação)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheLionGab/Pulso-Do-Campo
          ref: main
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/pulso-news/publicar.mjs
            scripts/pulso-news/frescor.mjs
          sparse-checkout-cone-mode: false

      - name: Conferir refs/remotes/origin/main do app
        run: |
          git -C app rev-parse --verify -q refs/remotes/origin/main >/dev/null ||
            git -C app fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          for f in publicar.mjs frescor.mjs; do
            git -C app cat-file -e "origin/main:scripts/pulso-news/$f"
          done
          echo "app origin/main em $(git -C app rev-parse --short origin/main)"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Python (numpy, soundfile, sherpa-onnx)
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy==2.4.6 soundfile==0.14.0 sherpa-onnx==2.0.3
          python -c "import numpy, soundfile, sherpa_onnx; print('python ok', numpy.__version__, soundfile.__version__)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videos/pulso-brasil/video/package-lock.json

      - name: ffmpeg e bibliotecas do Chrome do Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 \
            libdrm2 libpango-1.0-0 libcairo2
          ffmpeg -hide_banner -version | head -1

      - name: npm ci em video/
        working-directory: videos/pulso-brasil/video
        run: npm ci --no-audit --no-fund

      - name: Cache do Chrome do Remotion
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: videos/pulso-brasil/video/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('videos/pulso-brasil/video/package-lock.json') }}

      - name: Chrome do Remotion
        working-directory: videos/pulso-brasil/video
        run: npx remotion browser ensure

      - name: Cache do modelo sherpa-onnx whisper-base
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PULSO_MODELOS }}
          key: sherpa-whisper-base-911b2083

      - name: Modelo sherpa-onnx whisper-base (release público do k2-fsa)
        run: |
          set -euo pipefail
          m="$PULSO_MODELOS/sherpa-onnx-whisper-base"
          if [ -s "$m/base-encoder.onnx" ] && [ -s "$m/base-decoder.onnx" ] && [ -s "$m/base-tokens.txt" ]; then
            echo "modelo no cache"; exit 0
          fi
          mkdir -p "$PULSO_MODELOS"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/whisper-base.tar.bz2" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2
          echo "911b2083efd7c0dca2ac3b358b75222660dc09fb716d64fbfc417ba6c99ff3de  $RUNNER_TEMP/whisper-base.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/whisper-base.tar.bz2" -C "$PULSO_MODELOS" --exclude='*/test_wavs'
          rm -f "$RUNNER_TEMP/whisper-base.tar.bz2"
          test -s "$m/base-encoder.onnx" && test -s "$m/base-decoder.onnx" && test -s "$m/base-tokens.txt"

      - name: Cache do acervo (chave = manifest.json)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PULSO_ACERVO }}
          key: pulso-acervo-${{ hashFiles('videos/pulso-brasil/assets/manifest.json') }}

      - name: Acervo do bucket privado pulso-acervo
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -I "$RAIZ/assets/baixar_acervo.py" "$PULSO_ACERVO"

      - name: Cache da voz (trechos já sintetizados não gastam crédito de novo)
        id: voz
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PULSO_CACHE_VOZ }}
          key: pulso-voz-${{ github.run_id }}-${{ matrix.modo }}
          restore-keys: pulso-voz-

      - name: Episódio-exemplo (modo exemplo, sem Claude)
        if: env.MODO == 'exemplo'
        run: |
          set -euo pipefail
          cp -R "$RAIZ/exemplos/2026-11-24-dolar-soja/." "$PASTA/"
          ls -R "$PASTA"

      - name: Dados do dia por script (PTAX e IMEA)
        if: env.MODO == 'real'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          python -I "$RAIZ/diario/coletar_dados.py" "$PASTA" "$DIA" 2>&1 | tee "$LOGS/coleta.log"
          codigo="${PIPESTATUS[0]}"
          if [ "$codigo" -eq 3 ]; then
            echo "SEM_EPISODIO=1" >> "$GITHUB_ENV"
            echo "Sem episódio: $(cat "$PASTA/sem-episodio.txt")"
          elif [ "$codigo" -ne 0 ]; then
            exit "$codigo"
          fi

      - name: Claude escreve episodio.json e dossie.json (ferramentas restritas)
        if: env.MODO == 'real' && env.SEM_EPISODIO != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_TELEMETRY: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          set -euo pipefail
          prompt="$(cat "$RAIZ/diario/pauta.md")

          Dia: $DIA
          Pasta: $PASTA
          Molde: $RAIZ"
          # Mesmas ferramentas do agendado.sh: leitura no molde e na pasta do dia, escrita só na pasta do dia,
          # e o episodio.py. Sem rede, sem banco, sem outro Bash.
          npx --yes @anthropic-ai/claude-code@2.1.331 -p "$prompt" \
            --add-dir "$RAIZ" --max-turns 60 \
            --allowedTools "Read(/$RAIZ/**)" "Read(/$PASTA/**)" \
              "Glob(/$RAIZ/**)" "Glob(/$PASTA/**)" "Grep(/$RAIZ/**)" "Grep(/$PASTA/**)" \
              "Write(/$PASTA/**)" "Edit(/$PASTA/**)" \
              "Bash(python3 $RAIZ/episodio.py:*)" 2>&1 | tee "$LOGS/claude.log"
          # PTAX e IMEA gravados pelo script não podem ter sido mexidos pelo modelo.
          python -I "$RAIZ/diario/coletar_dados.py" --conferir "$PASTA" 2>&1 | tee -a "$LOGS/claude.log"
          if [ -f "$PASTA/sem-episodio.txt" ]; then
            echo "SEM_EPISODIO=1" >> "$GITHUB_ENV"
            echo "Sem episódio: $(cat "$PASTA/sem-episodio.txt")"
          fi

      - name: Conferir episódio e travar as fontes (G1 --travar)
        if: env.SEM_EPISODIO != '1'
        run: |
          set -euo pipefail
          test -f "$PASTA/episodio.json" && test -f "$PASTA/dossie.json" ||
            { echo "O Claude não gerou episodio.json e dossie.json" >&2; exit 1; }
          # Sem -I: o episodio.py importa audio/ da própria pasta (igual ao pulso-brasil.sh).
          python "$RAIZ/episodio.py" "$PASTA/episodio.json"
          grep -q fontes_sha256 "$PASTA/dossie.json" || python -I "$RAIZ/gates/g1_dossie.py" "$PASTA" --travar

      - name: Render (G1 a G5, voz ElevenLabs, Remotion)
        if: env.SEM_EPISODIO != '1'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TMPDIR: ${{ runner.temp }}/trabalho
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          PULSO_PYTHON="$(command -v python)"
          export PULSO_PYTHON
          cd "$RAIZ"
          ./pulso-brasil.sh "$PASTA/episodio.json" 2>&1 | tee "$LOGS/render.log"

      - name: Salvar a voz no cache (mesmo se um gate falhar depois)
        if: always() && steps.voz.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.PULSO_CACHE_VOZ }}
          key: pulso-voz-${{ github.run_id }}-${{ matrix.modo }}

      - name: Pronto (todos os gates passaram)
        id: pronto
        if: env.SEM_EPISODIO != '1'
        run: echo "pronto=true" >> "$GITHUB_OUTPUT"

      - name: Reunir o artifact
        if: always()
        run: |
          dest="$RUNNER_TEMP/artefato"
          mkdir -p "$dest"
          trabalho="$(find "$RUNNER_TEMP/trabalho" -maxdepth 1 -type d -name 'pulso-brasil.*' 2>/dev/null | head -1 || true)"
          if [ -n "$trabalho" ] && [ -d "$trabalho/out" ]; then
            cp -R "$trabalho/out" "$dest/out"
            cp "$trabalho/episodio.json" "$trabalho/dossie.json" "$dest/"
            cp -R "$trabalho/fontes" "$dest/fontes"
            mkdir -p "$dest/audio"
            cp "$trabalho/audio/sintese.json" "$trabalho/audio/asr.json" "$dest/audio/" 2>/dev/null || true
          else
            cp "$PASTA"/episodio.json "$PASTA"/dossie.json "$PASTA"/sem-episodio.txt "$dest/" 2>/dev/null || true
            cp -R "$PASTA/fontes" "$dest/fontes" 2>/dev/null || true
          fi
          cp -R "$LOGS" "$dest/logs" 2>/dev/null || true
          find "$dest" -type f -printf '%s %P\n' | sort -k2

      - name: Resumo do job
        if: always()
        run: |
          {
            echo "## Pulso Brasil $DIA (modo $MODO)"
            if [ "${SEM_EPISODIO:-}" = 1 ]; then echo "Sem episódio hoje: $(cat "$PASTA/sem-episodio.txt")"; fi
            if [ -f "$LOGS/render.log" ]; then
              echo '### Gates'; echo '```'
              grep -E "aprovado|reprovado|FALHA|Pronto:|G3 com|g_repeticao" "$LOGS/render.log" | cut -c1-200 | tail -30
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/artefato/out/ep.json" ]; then
              echo '### Episódio'; echo '```json'; cat "$RUNNER_TEMP/artefato/out/ep.json"; echo; echo '```'
            fi
            echo "Artifact: pulso-brasil-$MODO-$DIA (14 dias)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o artifact (mp4, capa, ep.json, legenda, manifesto, logs; 14 dias)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.contexto.outputs.artefato }}
          path: ${{ runner.temp }}/artefato
          retention-days: 14
          if-no-files-found: ignore

  publicar:
    name: publicar no app e registrar no histórico
    needs: gerar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.gerar.outputs.publicar == 'true' && needs.gerar.outputs.pronto == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # só para anexar a linha do dia ao videos/pulso-brasil/historico.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: App Pulso (só leitura, publicar.mjs da origin/main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheLionGab/Pulso-Do-Campo
          ref: main
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/pulso-news/publicar.mjs
            scripts/pulso-news/frescor.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.gerar.outputs.artefato }}
          path: ${{ runner.temp }}/artefato

      - name: Publicar (rascunho + aprovar, com o gate de frescor no banco)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ART: ${{ runner.temp }}/artefato
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/publicar"
          mkdir -p "$tmp"
          for f in publicar.mjs frescor.mjs; do git -C app show "origin/main:scripts/pulso-news/$f" > "$tmp/$f"; done
          id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$ART/out/ep.json")"
          node "$tmp/publicar.mjs" rascunho --meta "$ART/out/ep.json" --video "$ART/out/pulso-brasil.mp4" \
            --capa "$ART/out/capa.jpg" --dossie "$ART/dossie.json"
          node "$tmp/publicar.mjs" aprovar --id "$id" --dossie "$ART/dossie.json"

      - name: Anexar a linha do dia ao historico.jsonl (commit do bot)
        env:
          ART: ${{ runner.temp }}/artefato
          DIA: ${{ needs.gerar.outputs.dia }}
        run: |
          set -euo pipefail
          python3 - "$ART/episodio.json" <<'PY'
          import json, sys
          from pathlib import Path
          ep = json.loads(Path(sys.argv[1]).read_text())
          h = Path("videos/pulso-brasil/historico.jsonl")
          texto = h.read_text()
          if any(l.strip() and json.loads(l).get("data") == ep["data"] and json.loads(l).get("pauta_id") == ep["pauta_id"]
                 for l in texto.splitlines()):
              print("dia já registrado no histórico"); sys.exit(0)
          registro = {k: ep[k] for k in ("data", "pauta_id", "tema", "titulo", "numeros_chave")}
          if texto and not texto.endswith("\n"):
              texto += "\n"
          h.write_text(texto + json.dumps(registro, ensure_ascii=False, separators=(",", ":")) + "\n")
          PY
          if git diff --quiet -- videos/pulso-brasil/historico.jsonl; then echo "nada a commitar"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/pulso-brasil/historico.jsonl
          git commit -m "chore(pulso-brasil): histórico do episódio de $DIA publicado"
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 5))
          done
          echo "Não consegui enviar o commit do histórico" >&2; exit 1

  alerta:
    name: alerta (issue)
    needs: [gerar, publicar]
    if: always() && github.event_name != 'pull_request' && (needs.gerar.result == 'failure' || needs.publicar.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: ${{ needs.gerar.outputs.artefato }}
          path: ${{ runner.temp }}/artefato

      - name: Abrir ou comentar a issue (log sem chaves)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIA: ${{ needs.gerar.outputs.dia }}
        run: |
          redigir() { sed -E 's/(eyJ|sk-ant-|sk_|sb_secret_|AIza|github_pat_|ghp_|ghs_)[A-Za-z0-9_.-]{16,}/[redigido]/g'; }
          log=""
          for f in coleta.log claude.log render.log; do  # o último que existir é a etapa em que parou
            [ -f "$RUNNER_TEMP/artefato/logs/$f" ] && log="$(tail -n 12 "$RUNNER_TEMP/artefato/logs/$f" | redigir)"
          done
          corpo=$(printf 'O vídeo diário do Pulso Brasil (%s) NAO saiu pelo workflow.\n\nRun: %s\n\nÚltimas linhas do log:\n```\n%s\n```\n\nO artifact (se existir) tem os logs completos por 14 dias. Nada foi publicado no app.' "${DIA:-?}" "$RUN_URL" "$log")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label pulso-brasil-diario --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$corpo"
          else gh label create pulso-brasil-diario --repo "$GITHUB_REPOSITORY" --color B60205 --description "Alerta do Pulso Brasil diario" 2>/dev/null || true
               gh issue create --repo "$GITHUB_REPOSITORY" --label pulso-brasil-diario --title "Pulso Brasil diário falhou" --body "$corpo"; fi
